name: Build l2tppool via SDK

on:
  push:
    branches:
      - RandyZhai-patch-3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: package-src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget ccache rsync

      - name: Download OpenWrt SDK for x86_64
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar xf openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          echo "SDK_ROOT=$PWD/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64" >> $GITHUB_ENV

      - name: Copy package into SDK
        run: |
          cp -r package-src/package/luci-app-l2tp-pool-manager ${SDK_ROOT}/package/

      - name: Update and install feeds
        run: |
          cd ${SDK_ROOT}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (enable l2tppool)
        run: |
          cd ${SDK_ROOT}
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-l2tp-pool-manager=y
          EOF
          make defconfig

      - name: Build package
        run: |
          cd ${SDK_ROOT}
          make package/luci-app-l2tp-pool-manager/compile V=s -j$(nproc)

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-l2tp-pool-manager-ipk
          path: ${SDK_ROOT}/bin/packages/*/packages/luci-app-l2tp-pool-manager*.ipk
