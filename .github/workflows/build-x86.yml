name: Build OpenWrt x86_64 firmware

on:
  push:
    branches:
      - RandyZhai-patch-3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_PACKAGE_luci-app-l2tp-pool-manager=y
          CONFIG_PACKAGE_luci-app-pbr=y
          CONFIG_PACKAGE_pbr=y
          CONFIG_PACKAGE_xl2tpd=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppol2tp=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_jsonfilter=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_dnsmasq-full=y
          EOF
          make defconfig

      - name: Diagnose l2tppool package
        run: |
          echo "=== 1. Check luci.mk existence ==="
          ls -la feeds/luci/luci.mk 2>&1 || echo "NOT FOUND: feeds/luci/luci.mk"
          ls -la package/feeds/ 2>&1 | head -20
          echo ""
          echo "=== 2. Show package Makefile (cat -A shows all chars) ==="
          cat -A package/luci-app-l2tp-pool-manager/Makefile
          echo ""
          echo "=== 3. Try make dry-run parse (this reveals $(error) calls) ==="
          make -C package/luci-app-l2tp-pool-manager -n download V=sc 2>&1 || true
          echo ""
          echo "=== 4. Try make print-database ==="
          make -C package/luci-app-l2tp-pool-manager -p V=sc 2>&1 | head -100 || true
          echo ""
          echo "=== 5. Direct include test ==="
          cd package/luci-app-l2tp-pool-manager && make -f ../../../../include/toplevel.mk package/luci-app-l2tp-pool-manager/download V=99 2>&1 | tail -80 || true

      - name: Build firmware
        run: make -j1 V=sc

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86_64
          path: bin/targets/x86/64/*
